<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python Tutor AI</title>
<style>
:root{
  --navy:#14213d; --navy2:#1c2e52; --gold:#c9a24b; --ivory:#f7f3e8; --greyblue:#8fa3bf; --card:#22355e; --code:#0e1830;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--navy);color:var(--ivory);height:100vh;height:100dvh;display:flex;overflow:hidden}
aside{width:270px;background:#0f1a33;border-right:1px solid #2b3d66;padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#e6c777);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:20px}
.brand h1{font-size:18px;color:var(--gold)} .brand small{color:var(--greyblue);font-size:12px}
aside h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--greyblue);margin-top:6px}
.chip{background:var(--navy2);border:1px solid #2f4575;color:var(--ivory);padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;font-size:13.5px;transition:.15s}
.chip:hover{border-color:var(--gold);transform:translateX(2px)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{padding:14px 20px;border-bottom:1px solid #2b3d66;display:flex;align-items:center;gap:12px;background:var(--navy)}
header .menu{display:none;background:none;border:none;color:var(--gold);font-size:24px;cursor:pointer}
header .t{flex:1} header .t b{color:var(--gold)} header .t span{display:block;font-size:12px;color:var(--greyblue)}
.clear{background:none;border:1px solid #2f4575;color:var(--greyblue);padding:6px 12px;border-radius:8px;cursor:pointer}
.clear:hover{color:var(--gold);border-color:var(--gold)}
#chat{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
.msg{max-width:min(760px,92%);padding:14px 16px;border-radius:16px;line-height:1.6;font-size:15px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bot{background:var(--card);align-self:flex-start;border-top-left-radius:4px;border:1px solid #2f4575}
.user{background:var(--gold);color:var(--navy);align-self:flex-end;border-top-right-radius:4px;font-weight:500}
.msg h4{color:var(--gold);margin-bottom:6px}
.msg p{margin:6px 0} .msg ul,.msg ol{margin:6px 0 6px 20px}
.msg code.i{background:var(--code);padding:1px 6px;border-radius:5px;color:#ffd98a;font-family:Consolas,monospace;font-size:13.5px}
.codebox{background:var(--code);border:1px solid #2f4575;border-radius:10px;margin:10px 0;overflow:hidden}
.codebox .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#14234a;font-size:12px;color:var(--greyblue)}
.codebox button{background:none;border:1px solid #3a5088;color:var(--ivory);border-radius:6px;padding:2px 9px;cursor:pointer;font-size:12px;margin-left:6px}
.codebox button:hover{border-color:var(--gold);color:var(--gold)}
.codebox pre{padding:12px 14px;overflow-x:auto;font-family:Consolas,monospace;font-size:13.5px;line-height:1.55;color:#e8e2cf}
.out{border-top:1px dashed #3a5088;padding:10px 14px;color:#9fe0b0;font-family:Consolas,monospace;font-size:13px;white-space:pre-wrap}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt{background:var(--navy2);border:1px solid #3a5088;color:var(--ivory);padding:8px 12px;border-radius:9px;cursor:pointer;font-size:14px}
.opt:hover{border-color:var(--gold)} .opt.ok{background:#1f5a3a;border-color:#4cc98a} .opt.bad{background:#5a2330;border-color:#e0707f}
.typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--greyblue);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
#form{display:flex;gap:10px;padding:14px 20px;padding-bottom:max(14px,env(safe-area-inset-bottom));border-top:1px solid #2b3d66;background:#0f1a33}
textarea{flex:1;resize:none;background:var(--navy2);border:1px solid #2f4575;border-radius:12px;color:var(--ivory);padding:12px 14px;font:inherit;font-size:15px;max-height:140px;outline:none}
textarea:focus{border-color:var(--gold)}
#form button{background:var(--gold);color:var(--navy);border:none;border-radius:12px;padding:0 22px;font-weight:700;cursor:pointer}
#form button:hover{filter:brightness(1.08)}
@media(max-width:780px){
  textarea{font-size:16px}
  #chat{padding:16px 12px}
  #form{padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  header{padding:10px 12px}
  .msg{max-width:96%;font-size:14.5px}
  .codebox pre{font-size:12.5px}
  aside{position:fixed;left:-290px;top:0;bottom:0;z-index:10;transition:.25s}
  aside.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
  header .menu{display:block}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="logo">Py</div><div><h1>Python Tutor AI</h1><small>Learn Python step by step</small></div></div>
  <h3>Learn</h3>
  <button class="chip" data-q="Explain variables">Variables &amp; Data Types</button>

  <button class="chip" data-q="Explain args kwargs">*args &amp; **kwargs</button>

  <button class="chip" data-q="Explain sorting">Sorting &amp; Searching</button>
  <button class="chip" data-q="Explain scope">Variable Scope</button>
  <button class="chip" data-q="Explain recursion">Recursion</button>

  <button class="chip" data-q="Explain modules and pip">Modules &amp; pip</button>
  <button class="chip" data-q="Explain json">JSON</button>

  <h3>Data Science</h3>
  <button class="chip" data-q="Explain numpy">NumPy</button>

  <button class="chip" data-q="Explain matplotlib">Matplotlib</button>
  <h3>Practice</h3>
  <button class="chip" data-q="Give me a quiz">Take a Quiz</button>
  <button class="chip" data-q="Give me a practice problem">Practice Problem</button>
  <button class="chip" data-q="Study plan">Study Plan</button>
  <button class="chip" data-q="Common errors">Common Errors</button>
</aside>
<main>
  <header>
    <button class="menu" id="menu">☰</button>
    <div class="t"><b>Python Tutor AI</b><span>Ask a concept, paste code to explain, or request a quiz</span></div>
    <button class="clear" id="clear">Clear</button>
  </header>
  <div id="chat"></div>
  <div id="form">
    <textarea id="input" rows="1" placeholder="Ask about Python…"></textarea>
    <button type="button" id="send">Send</button>
  </div>
</main>

<script>
/* ===================== KNOWLEDGE BASE ===================== */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const code = (c,out) => ({code:c,out});

const TOPICS = {
 variables:{
  keys:["variable","data type","datatype","int","float","type()","assignment"],
  title:"Variables & Data Types",
  text:"A <b>variable</b> is a name that stores a value. Python figures out the type automatically (dynamic typing). Common types: <code class='i'>int</code>, <code class='i'>float</code>, <code class='i'>str</code>, <code class='i'>bool</code>.",
  ex:code(`name = "Sania"\nage = 20\ngpa = 3.8\nis_student = True\n\nprint(name, age, gpa, is_student)\nprint(type(age))`,"Sania 20 3.8 True\n<class 'int'>"),
  tips:["Names are case-sensitive: <code class='i'>Age</code> ≠ <code class='i'>age</code>.","Use snake_case: <code class='i'>my_score</code>.","Convert types with <code class='i'>int()</code>, <code class='i'>float()</code>, <code class='i'>str()</code>."]},
 ifelse:{
  keys:["if","else","elif","condition","conditional","decision"],
  title:"If / Elif / Else",
  text:"Conditionals let your program choose a path. Python uses <b>indentation</b> (4 spaces) to mark the block.",
  ex:code(`marks = 72\nif marks >= 85:\n    print("A")\nelif marks >= 70:\n    print("B")\nelse:\n    print("Keep going!")`,"B"),
  tips:["Comparison: <code class='i'>== != &lt; &gt; &lt;= &gt;=</code>","Combine with <code class='i'>and</code>, <code class='i'>or</code>, <code class='i'>not</code>.","Don't forget the colon <code class='i'>:</code> after the condition."]},
 loops:{
  keys:["loop","for","while","range","iterate","iteration","break","continue"],
  title:"Loops",
  text:"<b>for</b> loops repeat over a sequence; <b>while</b> loops repeat while a condition is true.",
  ex:code(`for i in range(1, 4):\n    print("Square of", i, "is", i*i)\n\ncount = 3\nwhile count > 0:\n    print(count)\n    count -= 1`,"Square of 1 is 1\nSquare of 2 is 4\nSquare of 3 is 9\n3\n2\n1"),
  tips:["<code class='i'>range(a, b)</code> stops <i>before</i> b.","<code class='i'>break</code> exits a loop; <code class='i'>continue</code> skips to the next round.","A while loop whose condition never becomes False runs forever."]},
 functions:{
  keys:["function","def","return","parameter","argument"],
  title:"Functions",
  text:"A <b>function</b> is reusable code. Define it with <code class='i'>def</code>, give it parameters, and send a result back with <code class='i'>return</code>.",
  ex:code(`def area(length, width=1):\n    return length * width\n\nprint(area(5, 4))\nprint(area(7))\n\nsquare = lambda x: x ** 2\nprint(square(6))`,"20\n7\n36"),
  tips:["<code class='i'>print</code> shows a value; <code class='i'>return</code> hands it back.","Default values (<code class='i'>width=1</code>) make arguments optional.","Variables created inside a function are local to it."]},
 lists:{
  keys:["list","append","slice","slicing"],
  title:"Lists",
  text:"A <b>list</b> stores an ordered, changeable collection. Indexing starts at 0.",
  ex:code(`nums = [5, 2, 9]\nnums.append(1)\nnums.sort()\nprint(nums)\nprint(nums[0], nums[-1])\nprint(nums[1:3])\nprint([n*2 for n in nums])`,"[1, 2, 5, 9]\n1 9\n[2, 5]\n[2, 4, 10, 18]"),
  tips:["<code class='i'>len(list)</code> gives its size.","<b>Tuples</b> <code class='i'>(1,2)</code> are like lists but cannot change.","<b>Sets</b> <code class='i'>{1,2}</code> hold unique items only.","The last line above is a <i>list comprehension</i>."]},
 dicts:{
  keys:["dictionary","dictionaries","dict","key","value","hash"],
  title:"Dictionaries",
  text:"A <b>dictionary</b> stores <i>key → value</i> pairs, great for labelled data.",
  ex:code(`student = {"name": "Sania", "marks": 88}\nstudent["city"] = "Multan"\nprint(student["name"])\nprint(student.get("age", "unknown"))\nfor k, v in student.items():\n    print(k, "=", v)`,"Sania\nunknown\nname = Sania\nmarks = 88\ncity = Multan"),
  tips:["Use <code class='i'>.get(key, default)</code> to avoid KeyError.","Keys must be unique and immutable (str, int, tuple)."]},
 strings:{
  keys:["string","str","upper","lower","split","join","format","f-string","fstring"],
  title:"Strings",
  text:"Strings are text in quotes. Use <b>f-strings</b> to put variables inside text.",
  ex:code(`s = "  Python is fun  "\nprint(s.strip().upper())\nprint(s.split())\nname, n = "Ali", 3\nprint(f"{name} scored {n*10} points")\nprint("-".join(["a","b","c"]))`,"PYTHON IS FUN\n['Python', 'is', 'fun']\nAli scored 30 points\na-b-c"),
  tips:["Strings are immutable: methods return a <i>new</i> string.","Slicing works too: <code class='i'>\"Python\"[0:3]</code> → <code class='i'>Pyt</code>."]},
 classes:{
  keys:["class","classes","object","oop","init","self","method","constructor"],
  title:"Classes & OOP",
  text:"A <b>class</b> is a blueprint; an <b>object</b> is one thing built from it. <code class='i'>__init__</code> runs when an object is created, and <code class='i'>self</code> refers to that object.",
  ex:code(`class Student:\n    def __init__(self, name):\n        self.name = name\n        self.marks = []\n\n    def add(self, m):\n        self.marks.append(m)\n\n    def average(self):\n        return sum(self.marks) / len(self.marks)\n\ns = Student("Sania")\ns.add(80); s.add(90)\nprint(s.average())`,"85.0"),
  tips:["Inheritance: <code class='i'>class Child(Parent):</code>","Every method's first parameter is <code class='i'>self</code>."]},
 files:{
  keys:["file","open","read","write","with open","txt"],
  title:"File Handling",
  text:"Use <code class='i'>with open()</code> so the file closes automatically. Modes: <code class='i'>'r'</code> read, <code class='i'>'w'</code> write (overwrites), <code class='i'>'a'</code> append.",
  ex:code(`with open("notes.txt", "w") as f:\n    f.write("Hello file!\\n")\n\nwith open("notes.txt") as f:\n    for line in f:\n        print(line.strip())`,"Hello file!"),
  tips:["<code class='i'>FileNotFoundError</code> means the path is wrong.","Use <code class='i'>'w'</code> carefully — it erases existing content."]},
 exceptions:{
  keys:["exception","exceptions","error handling","try","except","finally","raise","traceback"],
  title:"Error Handling",
  text:"<code class='i'>try / except</code> lets your program handle errors instead of crashing.",
  ex:code(`try:\n    n = int(input("Number: "))\n    print(10 / n)\nexcept ZeroDivisionError:\n    print("Can't divide by zero")\nexcept ValueError:\n    print("Please type digits")\nfinally:\n    print("Done")`,"(if you type 0)\nCan't divide by zero\nDone"),
  tips:["Catch specific errors, not everything.","<code class='i'>finally</code> always runs."]},

 /* ---------- Intermediate ---------- */
 comprehensions:{
  keys:["comprehension","comprehensions","list comprehension","dict comprehension","one line loop"],
  title:"Comprehensions",
  text:"A <b>comprehension</b> builds a list, dictionary or set in one short line. Pattern: <code class='i'>[expression for item in sequence if condition]</code>.",
  ex:code(`squares = [x*x for x in range(5)]\nevens = [x for x in range(10) if x % 2 == 0]\nlengths = {w: len(w) for w in ["hi", "python"]}\nremainders = {x % 3 for x in range(10)}\n\nprint(squares)\nprint(evens)\nprint(lengths)\nprint(remainders)`,"[0, 1, 4, 9, 16]\n[0, 2, 4, 6, 8]\n{'hi': 2, 'python': 6}\n{0, 1, 2}"),
  tips:["Square brackets → list, curly with <code class='i'>key: value</code> → dict, curly without → set.","If it gets long or confusing, use a normal loop instead."]},
 lambdamap:{
  keys:["lambda","map","filter","reduce","higher order","anonymous function"],
  title:"Lambda, map() & filter()",
  text:"A <b>lambda</b> is a tiny one-line function with no name. <code class='i'>map()</code> applies a function to every item; <code class='i'>filter()</code> keeps only items that pass a test.",
  ex:code(`nums = [1, 2, 3, 4, 5]\nsquares = list(map(lambda x: x ** 2, nums))\nevens = list(filter(lambda x: x % 2 == 0, nums))\nwords = sorted(["bb", "a", "ccc"], key=len)\n\nprint(squares)\nprint(evens)\nprint(words)`,"[1, 4, 9, 16, 25]\n[2, 4]\n['a', 'bb', 'ccc']"),
  tips:["Syntax: <code class='i'>lambda arguments: expression</code>.","<code class='i'>map</code> and <code class='i'>filter</code> return iterators, so wrap them in <code class='i'>list()</code> to see the result.","Comprehensions often read more clearly than map/filter."]},
 argskwargs:{
  keys:["args","kwargs","*args","**kwargs","variable arguments","keyword arguments","unpacking"],
  title:"*args and **kwargs",
  text:"<code class='i'>*args</code> collects any number of positional arguments into a tuple. <code class='i'>**kwargs</code> collects named arguments into a dictionary.",
  ex:code(`def total(*nums):\n    return sum(nums)\n\ndef info(**details):\n    for key, value in details.items():\n        print(key, value)\n\nprint(total(1, 2, 3))\ninfo(name="Ali", age=20)`,"6\nname Ali\nage 20"),
  tips:["The names <code class='i'>args</code>/<code class='i'>kwargs</code> are convention; the stars are what matter.","Order in a definition: normal parameters, <code class='i'>*args</code>, then <code class='i'>**kwargs</code>."]},
 setstuples:{
  keys:["set","sets","tuple","tuples","union","intersection","immutable","unique"],
  title:"Sets & Tuples",
  text:"A <b>set</b> holds unique items with no order and is great for removing duplicates and comparing groups. A <b>tuple</b> is like a list that cannot be changed.",
  ex:code(`s = {1, 2, 2, 3}\na = {1, 2, 3}\nb = {2, 3, 4}\nprint(s)\nprint(a & b)\nprint(a | b)\nprint(a - b)\n\nt = (10, 20)\nx, y = t\nprint(x, y)`,"{1, 2, 3}\n{2, 3}\n{1, 2, 3, 4}\n{1}\n10 20"),
  tips:["<code class='i'>&amp;</code> intersection, <code class='i'>|</code> union, <code class='i'>-</code> difference.","Remove duplicates from a list: <code class='i'>list(set(my_list))</code> (order may change).","An empty set is <code class='i'>set()</code>, not <code class='i'>{}</code> (that is a dict)."]},
 sorting:{
  keys:["sort","sorted","sorting","order","ascending","descending","binary search","searching"],
  title:"Sorting & Searching",
  text:"<code class='i'>sorted()</code> returns a new sorted list; <code class='i'>.sort()</code> sorts the list in place. Use <code class='i'>key=</code> to choose what to sort by.",
  ex:code(`nums = [5, 2, 9]\nprint(sorted(nums))\nnums.sort(reverse=True)\nprint(nums)\n\nstudents = [("Ali", 80), ("Sara", 92)]\nprint(sorted(students, key=lambda s: s[1], reverse=True))\n\nprint(9 in nums)`,"[2, 5, 9]\n[9, 5, 2]\n[('Sara', 92), ('Ali', 80)]\nTrue"),
  tips:["<code class='i'>in</code> checks membership (linear search).","On a <i>sorted</i> list, binary search is much faster: check the middle and discard half each time.","The <code class='i'>bisect</code> module provides binary search."]},
 scope:{
  keys:["scope","global","local","legb","nonlocal","global variable","local variable"],
  title:"Variable Scope",
  text:"Scope decides where a variable can be seen. Python looks in this order: <b>L</b>ocal → <b>E</b>nclosing → <b>G</b>lobal → <b>B</b>uilt-in (LEGB).",
  ex:code(`x = 10\n\ndef f():\n    x = 5\n    print("inside:", x)\n\nf()\nprint("outside:", x)`,"inside: 5\noutside: 10"),
  tips:["Assigning inside a function creates a new local variable.","Use <code class='i'>global x</code> to change a global (use sparingly).","Prefer passing values in and returning results."]},
 recursion:{
  keys:["recursion","recursive","recurse","base case"],
  title:"Recursion",
  text:"A <b>recursive</b> function calls itself on a smaller version of the problem. It needs a <b>base case</b> that stops the calls.",
  ex:code(`def factorial(n):\n    if n <= 1:          # base case\n        return 1\n    return n * factorial(n - 1)\n\ndef fib(n):\n    if n < 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\nprint(factorial(5))\nprint([fib(i) for i in range(8)])`,"120\n[0, 1, 1, 2, 3, 5, 8, 13]"),
  tips:["No base case → <code class='i'>RecursionError</code> (too many calls).","Plain <code class='i'>fib</code> is slow for big n; caching with <code class='i'>functools.lru_cache</code> fixes it.","Many recursive problems can also be written with a loop."]},
 inheritance:{
  keys:["inheritance","inherit","super","polymorphism","overriding","override","parent class","child class"],
  title:"Inheritance & Polymorphism",
  text:"A <b>child class</b> reuses everything from a <b>parent class</b> and can override methods. Different classes responding to the same method name is <b>polymorphism</b>.",
  ex:code(`class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        return "..."\n\nclass Dog(Animal):\n    def speak(self):\n        return "Woof"\n\nclass Cat(Animal):\n    def speak(self):\n        return "Meow"\n\nfor a in [Animal("Generic"), Dog("Rex"), Cat("Tom")]:\n    print(a.name, a.speak())`,"Generic ...\nRex Woof\nTom Meow"),
  tips:["<code class='i'>super().__init__(...)</code> calls the parent's constructor.","Child classes inherit all parent methods automatically."]},
 decorators:{
  keys:["decorator","decorators","@","wrapper","closure"],
  title:"Decorators",
  text:"A <b>decorator</b> wraps a function to add behaviour before or after it runs, without changing the function itself. You apply it with <code class='i'>@name</code> above the function.",
  ex:code(`def shout(func):\n    def wrapper():\n        print("Before")\n        func()\n        print("After")\n    return wrapper\n\n@shout\ndef hi():\n    print("Hi!")\n\nhi()`,"Before\nHi!\nAfter"),
  tips:["<code class='i'>@shout</code> is shorthand for <code class='i'>hi = shout(hi)</code>.","Real uses: timing, logging, login checks.","Use <code class='i'>functools.wraps</code> to keep the original function's name."]},
 generators:{
  keys:["generator","generators","yield","iterator","iterators","lazy"],
  title:"Generators",
  text:"A <b>generator</b> produces values one at a time using <code class='i'>yield</code> instead of building a whole list, saving memory.",
  ex:code(`def count_up(n):\n    i = 1\n    while i <= n:\n        yield i\n        i += 1\n\nfor x in count_up(3):\n    print(x)\n\nprint(sum(x * x for x in range(4)))`,"1\n2\n3\n14"),
  tips:["A generator can be used only once.","<code class='i'>(x*x for x in data)</code> with round brackets is a generator expression."]},
 modules:{

/* ===================== HELPERS ===================== */
const chat = document.getElementById("chat");
const input = document.getElementById("input");
let quizIdx = 0, quizScore = 0, quizOrder = [], lastProblem = null, lastTopic = null;

function scroll(){ chat.scrollTop = chat.scrollHeight; }
function addUser(t){ const d=document.createElement("div"); d.className="msg user"; d.textContent=t; chat.appendChild(d); scroll(); }
function addBot(html){ const d=document.createElement("div"); d.className="msg bot"; d.innerHTML=html; chat.appendChild(d); scroll(); return d; }
function codeBox(src,out){
  const id="c"+Math.random().toString(36).slice(2,8);
  return `<div class="codebox"><div class="bar"><span>python</span><span><button onclick="copyCode('${id}')">Copy</button></span></div><pre id="${id}">${esc(src)}</pre>${out?`<div class="out">▶ Output\n${esc(out)}</div>`:""}</div>`;
}
window.copyCode = id => { navigator.clipboard?.writeText(document.getElementById(id).innerText); };
function reply(html, delay=450){
  const t = addBot('<div class="typing"><span></span><span></span><span></span></div>');
  setTimeout(()=>{ t.innerHTML = html; scroll(); }, delay);
  return t;
}
function topicHTML(t){
  return `<h4>${t.title}</h4><p>${t.text}</p>${codeBox(t.ex.code,t.ex.out)}<b>Key points</b><ul>${t.tips.map(x=>`<li>${x}</li>`).join("")}</ul><p>Want a <a href="#" onclick="ask('Give me a quiz');return false" style="color:var(--gold)">quiz</a> or a <a href="#" onclick="ask('Give me a practice problem');return false" style="color:var(--gold)">practice problem</a>?</p>`;
}
window.ask = q => { addUser(q); respond(q); };

/* ===================== QUIZ ===================== */
function startQuiz(){
  quizOrder = [...QUIZ.keys()].sort(()=>Math.random()-.5).slice(0,5);
  quizIdx = 0; quizScore = 0;
  reply("<h4>Python Quiz 🧠</h4><p>5 questions. Pick the best answer.</p>");
  setTimeout(showQ, 700);
}
function showQ(){
  const q = QUIZ[quizOrder[quizIdx]];
  const box = addBot(`<b>Q${quizIdx+1}/5.</b> ${q.q}<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`);
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; box.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    box.querySelectorAll(".opt")[q.a].classList.add("ok");
    if(i===q.a){quizScore++;} else b.classList.add("bad");
    const fb=document.createElement("p"); fb.innerHTML=(i===q.a?"✅ Correct! ":"❌ Not quite. ")+q.e; box.appendChild(fb);
    quizIdx++;
    setTimeout(()=>{
      if(quizIdx<5) showQ();
      else reply(`<h4>Quiz finished</h4><p>You scored <b>${quizScore}/5</b>. ${quizScore>=4?"Excellent work!":quizScore>=2?"Good effort — review the topics you missed.":"Keep practising, you'll get there!"}</p><p>Type “quiz” to try new questions.</p>`,300);
    },900);
  });
  scroll();
}

/* ===================== CODE EXPLAINER ===================== */
function explainCode(src){
  const lines = src.split("\n").filter(l=>l.trim());
  const notes = [];
  lines.forEach((l,i)=>{
    const t=l.trim(); let n="";
    if(/^def\s+(\w+)\((.*)\)/.test(t)){const m=t.match(/^def\s+(\w+)\((.*)\)/);n=`Defines a function <code class='i'>${m[1]}</code>${m[2]?` taking <code class='i'>${esc(m[2])}</code>`:""}.`;}
    else if(/^class\s+(\w+)/.test(t)) n=`Defines a class <code class='i'>${t.match(/^class\s+(\w+)/)[1]}</code> (a blueprint for objects).`;
    else if(/^for\s/.test(t)) n="Starts a <b>for</b> loop that repeats the indented block for each item.";
    else if(/^while\s/.test(t)) n="Starts a <b>while</b> loop that repeats while the condition is true.";
    else if(/^if\s/.test(t)) n="Checks a condition; the indented block runs only if it is true.";
    else if(/^elif\s/.test(t)) n="Another condition checked if the previous ones were false.";
    else if(/^else\s*:/.test(t)) n="Runs when none of the above conditions were true.";
    else if(/^try\s*:/.test(t)) n="Begins a block where errors will be caught.";
    else if(/^except/.test(t)) n="Handles an error from the <code class='i'>try</code> block.";
    else if(/^import\s|^from\s.+import/.test(t)) n="Imports a module so its tools can be used.";
    else if(/^return\b/.test(t)) n="Sends a value back from the function.";
    else if(/input\(/.test(t)) n="Reads text typed by the user.";
    else if(/^print\(/.test(t)) n="Displays output on the screen.";
    else if(/^with\s+open/.test(t)) n="Opens a file safely; it closes automatically afterwards.";
    else if(/^\w+(\[.*\])?\s*[+\-*/]?=\s*/.test(t)) n="Assigns a value to a variable.";
    else if(/\.append\(/.test(t)) n="Adds an item to the end of a list.";
    if(n) notes.push(`<li><code class='i'>${esc(t.length>50?t.slice(0,50)+"…":t)}</code> — ${n}</li>`);
  });
  return `<h4>Code walkthrough</h4>${codeBox(src)}${notes.length?`<ol>${notes.join("")}</ol>`:"<p>I couldn't recognise common patterns here. Try a smaller snippet.</p>"}<p><i>Note: I read code line by line, I don't run it. Ask “common errors” if you got an error message.</i></p>`;
}

/* ===================== ROUTER ===================== */
function match(q){
  const w = q.toLowerCase();
  let best=null,score=0;
  for(const k in TOPICS){
    let s=0;
    TOPICS[k].keys.forEach(key=>{ const re=new RegExp("(^|[^a-z])"+key.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"s?([^a-z]|$)"); if(re.test(w)) s += key.length>3?2:1; });
    if(s>score){score=s;best=k;}
  }
  return score>0?best:null;
}
function respond(q){
  const w=q.toLowerCase().trim();
  // pasted code
  if(/\n/.test(q) && /(def |print\(|for |while |if |import |class )/.test(q) || /^(explain|what does).*(code|this)/.test(w) && /\n/.test(q)){
    return reply(explainCode(q.replace(/^(explain|what does)[^\n]*\n/i,"")));
  }
  if(/^(hi|hello|hey|salam|assalam)\b/.test(w)) return reply("<h4>Hello! 👋</h4><p>I'm your Python tutor. Ask me about any concept, paste code for a line-by-line explanation, or ask for a quiz.</p>");
  if(/thank|shukriya/.test(w)) return reply("You're welcome! Keep coding. 🐍");
  if(/quiz|test me|mcq/.test(w)) return startQuiz();
  if(/practice|problem|exercise|challenge/.test(w)){
    const p = PROBLEMS[Math.floor(Math.random()*PROBLEMS.length)]; lastProblem=p;
    return reply(`<h4>Practice: ${p.t}</h4><p>${p.d}</p><div class="opts"><button class="opt" onclick="ask('Hint')">Hint</button><button class="opt" onclick="ask('Show solution')">Show solution</button><button class="opt" onclick="ask('Give me a practice problem')">Another problem</button></div>`);
  }
  if(/^hint/.test(w)) return reply(lastProblem?`<b>Hint:</b> ${lastProblem.hint}`:"Ask for a practice problem first.");
  if(/solution|answer/.test(w) && lastProblem) return reply(`<h4>Solution: ${lastProblem.t}</h4>${codeBox(lastProblem.sol)}<p>Try writing it yourself first next time, then compare.</p>`);
  if(/study plan|\bplan\b|roadmap|schedule|where to start|syllabus/.test(w)) return reply(`<h4>6-Week Python Study Plan</h4><ol>
   <li><b>Week 1:</b> Variables, data types, input/output, if/else.</li>
   <li><b>Week 2:</b> Loops, strings, lists. Solve 3 small problems daily.</li>
   <li><b>Week 3:</b> Functions, dictionaries, file handling, error handling.</li>
   <li><b>Week 4:</b> Classes &amp; OOP, then build a mini project (e.g., a to-do list or grade calculator).</li>
   <li><b>Week 5:</b> Comprehensions, lambda/map/filter, modules, JSON, recursion, decorators and generators.</li>
   <li><b>Week 6:</b> Data science: NumPy arrays, Pandas DataFrames and Matplotlib charts. Finish with a mini analysis of a CSV file.</li></ol>
   <p>Tip: 45 minutes of daily practice beats one long weekly session.</p>`);
  if(/\berrors?\b|traceback|\bbug\b|not working/.test(w) && !/handling|try|except/.test(w)){
    const hit = ERRORS.find(e=>w.includes(e[0].toLowerCase()));
    const list = hit?[hit]:ERRORS;
    return reply(`<h4>${hit?hit[0]:"Common Python Errors"}</h4>${list.map(e=>`<p><b>${e[0]}</b> — ${e[1]}</p>${codeBox(e[2])}`).join("")}${hit?"":"<p>Paste the exact error name and I'll explain it.</p>"}`);
  }
  for(const e of ERRORS) if(w.includes(e[0].toLowerCase())) return reply(`<h4>${e[0]}</h4><p>${e[1]}</p>${codeBox(e[2])}`);
  if(/(difference|vs|versus).*(list|tuple)|(list|tuple).*(vs|difference)/.test(w)) return reply("<h4>List vs Tuple</h4><ul><li><b>List</b> <code class='i'>[1,2]</code> — changeable (mutable).</li><li><b>Tuple</b> <code class='i'>(1,2)</code> — fixed (immutable), slightly faster, can be a dictionary key.</li></ul>");
  if(/what is python|about python|why python/.test(w)) return reply("<h4>What is Python?</h4><p>Python is a beginner-friendly, high-level programming language known for readable code. It is used in data science, web development, automation, AI and more.</p>"+codeBox('print("Hello, World!")',"Hello, World!"));
  if(/hello world|first program/.test(w)) return reply("<h4>Your first program</h4>"+codeBox('print("Hello, World!")',"Hello, World!")+"<p><code class='i'>print()</code> shows text on screen.</p>");
  if(/input|user input/.test(w)) return reply("<h4>Taking input</h4><p><code class='i'>input()</code> always returns text, so convert it when you need a number.</p>"+codeBox('age = int(input("Age: "))\nprint("Next year you will be", age + 1)'));
  if(/\bprime\b/.test(w)) return reply("<h4>Prime number check</h4>"+codeBox('def is_prime(n):\n    if n < 2:\n        return False\n    for i in range(2, int(n**0.5)+1):\n        if n % i == 0:\n            return False\n    return True\n\nprint(is_prime(17))',"True")+"<p>We only test divisors up to √n because larger factors pair with smaller ones.</p>");
  if(/fibonacci/.test(w)) return reply("<h4>Fibonacci</h4>"+codeBox('a, b = 0, 1\nfor _ in range(8):\n    print(a, end=" ")\n    a, b = b, a + b',"0 1 1 2 3 5 8 13"));
  const k = match(q);
  if(k){ lastTopic=k; return reply(topicHTML(TOPICS[k])); }
  reply(`<h4>I'm not sure what you mean yet</h4><p>I'd rather ask than guess. Could you tell me which topic you want?</p><div class="opts">${["Variables","Loops","Functions","Lists","Dictionaries","Classes"].map(x=>`<button class="opt" onclick="ask('Explain ${x.toLowerCase()}')">${x}</button>`).join("")}</div><p>You can also paste code and I'll walk through it.</p>`);
}

/* ===================== UI WIRING ===================== */
function send(){
  const v=input.value.trim(); if(!v) return;
  addUser(v); input.value=""; input.style.height="auto"; respond(v);
}
document.getElementById("send").addEventListener("click",send);
input.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();} });
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px";});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ addUser(c.dataset.q); respond(c.dataset.q); document.getElementById("side").classList.remove("open"); });
document.getElementById("menu").onclick=()=>document.getElementById("side").classList.toggle("open");
document.getElementById("clear").onclick=()=>{chat.innerHTML=""; welcome();};
document.addEventListener("click",e=>{ const s=document.getElementById("side"); if(s.classList.contains("open") && !s.contains(e.target) && e.target.id!=="menu") s.classList.remove("open"); });

function welcome(){
  addBot(`<h4>Welcome to Python Tutor AI 🐍</h4><p>I can explain Python concepts, including NumPy, Pandas and Matplotlib, with examples, walk through code you paste, give quizzes and practice problems, and build a study plan.</p><div class="opts">
   <button class="opt" onclick="ask('Explain variables')">Start with variables</button>
   <button class="opt" onclick="ask('Give me a quiz')">Take a quiz</button>
   <button class="opt" onclick="ask('Give me a practice problem')">Practice problem</button>
   <button class="opt" onclick="ask('Study plan')">Study plan</button></div>`);
}
welcome();
</script>
